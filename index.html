<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Você, Sara 💌</title>
<meta name="theme-color" content="#f7d6dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fbe3e8; --bg2:#f3c1cc;
    --env:#e8828f; --env-dark:#cf6575; --env-flap:#f0959f;
    --paper:#fffaf3; --ink:#5a2a35; --accent:#d94a64;
    --w:min(86vw,380px); --h:calc(var(--w)*0.64);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2));
    font-family:'Lora',Georgia,serif;color:var(--ink);
    overflow:hidden;display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  body.reading{overflow-y:auto}

  /* ---------- envelope ---------- */
  .stage{position:relative;width:var(--w);height:var(--h);cursor:pointer;
    filter:drop-shadow(0 18px 24px rgba(140,40,60,.25));
    animation:float 3.2s ease-in-out infinite;
    transition:transform 1s cubic-bezier(.6,-.2,.4,1),opacity .8s}
  .stage.opened{animation:none;cursor:default}
  .stage.gone{transform:translateY(70vh) rotate(6deg);opacity:0}
  @keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}

  .env-back,.env-front,.env-flap{position:absolute;inset:0;border-radius:6px}
  .env-back{background:var(--env-dark);z-index:1}
  .env-front{z-index:3;background:linear-gradient(160deg,var(--env),var(--env-dark));
    clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
  .env-flap{z-index:4;height:62%;background:var(--env-flap);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transform:perspective(900px) rotateX(0);
    transition:transform .7s ease-in-out}
  .stage.opened .env-flap{transform:perspective(900px) rotateX(180deg)}
  .stage.flap-back .env-flap{z-index:1}
  .to{position:absolute;left:0;right:0;bottom:12%;text-align:center;
    font-family:'Dancing Script',cursive;font-size:clamp(1.3rem,6vw,1.7rem);color:#fff4f6;
    text-shadow:0 1px 2px rgba(120,20,40,.3)}

  .seal{position:absolute;z-index:5;left:50%;top:62%;width:54px;height:54px;
    transform:translate(-50%,-50%);display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#e9506b,#a51f3a);border-radius:50%;
    box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 -3px 6px rgba(0,0,0,.25);
    color:#ffd9df;font-size:24px;transition:transform .4s,opacity .4s}
  .stage.opened .seal{transform:translate(-50%,-50%) scale(0) rotate(90deg);opacity:0}

  .hint{position:absolute;top:calc(100% + 34px);left:0;right:0;text-align:center;
    font-family:'Dancing Script',cursive;font-size:1.5rem;color:var(--accent);
    animation:pulse 1.8s ease-in-out infinite}
  .stage.opened .hint{opacity:0;animation:none;transition:opacity .3s}
  @keyframes pulse{50%{opacity:.45;transform:scale(.96)}}

  /* ---------- letter ---------- */
  .letter{position:absolute;z-index:2;left:6%;right:6%;bottom:5%;height:88%;
    background:var(--paper);border-radius:4px;padding:18px 20px;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
    transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
  .stage.pulled .letter{transform:translateY(-78%)}
  .letter .peek{font-family:'Dancing Script',cursive;font-size:1.7rem;color:var(--accent);text-align:center}

  /* letter after it leaves the envelope (moved to body) */
  .letter.free{position:fixed;z-index:10;margin:0;overflow-y:auto;
    transition:all .9s cubic-bezier(.3,.8,.3,1)}
  .letter.big{left:50%!important;top:50%!important;width:min(92vw,560px)!important;
    height:auto!important;max-height:88vh;transform:translate(-50%,-50%) rotate(-.6deg)!important;
    padding:32px clamp(20px,6vw,48px) 32px;background-attachment:local;
    box-shadow:0 30px 60px rgba(120,30,50,.3);
    background:var(--paper) repeating-linear-gradient(transparent 0 31px,#f1dfe0 31px 32px)}
  .content{opacity:0;transition:opacity .8s .5s}
  .letter.big .peek{display:none}
  .letter.big .content{opacity:1}
  .content p{line-height:32px;font-size:1.05rem;margin-bottom:32px;
    opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}
  .content p.show{opacity:1;transform:none}
  .content .sign{font-family:'Great Vibes',cursive;font-size:2.4rem;line-height:64px;text-align:right;color:var(--accent);margin:0}

  /* ---------- hearts ---------- */
  .heart{position:fixed;pointer-events:none;z-index:8;will-change:transform,opacity;
    animation:rise var(--d) ease-out forwards}
  .heart svg{display:block;width:100%;height:100%}
  @keyframes rise{
    0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}
    10%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}
  }

  @media (prefers-reduced-motion:reduce){
    .stage{animation:none}.hint{animation:none}
  }
</style>
</head>
<body>

<div class="stage" id="stage" role="button" tabindex="0" aria-label="Abrir a carta">
  <div class="env-back"></div>
  <div class="letter" id="letter">
    <div class="peek">Para Você, Sara ♥</div>
    <div class="content" id="content"></div>
  </div>
  <div class="env-front"><span class="to">Para Você, Sara</span></div>
  <div class="env-flap"></div>
  <div class="seal">♥</div>
  <div class="hint">toque para abrir</div>
</div>

<script>
/* ============ EDITE AQUI O TEXTO DA CARTA ============ */
const CARTA = {
  paragrafos: [
    "Olá bolinho de cupuaçu, não irei mentir, já escrevi algumas cartas antes então essa não é a primeira vez, mas é a primeira vez pra você.",
    "Desde que te conheci, meus dias tem sido mais coloridos e especiais, como eu sempre digo, você é o sol que ilumina as minhas manhãs (no meu caso, a lua que ilumina a minha noite, sempre com a luz mais brilhante que as estrelas do céu).",
    "São poucos os momentos mas pra mim são especiais, como uma simples call de madrugada no domingo, dando altas risadas do demência indo cagar e falando que a vó pensou que ele estava batendo punheta.",
    "Eu só queria agradecer por isso, pelos poucos e bons momentos, dizer que estou aqui para o que precisar. Nem que isso demora 4 meses :)"
  ],
  assinatura: "Ass. Ticos"
};
/* ===================================================== */

const stage = document.getElementById('stage');
const letter = document.getElementById('letter');
const content = document.getElementById('content');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLORS = ['#e63e5c','#ff7a93','#ffb3c1','#c9184a','#ff4d6d'];
let opened = false, ambient;

content.innerHTML =
  CARTA.paragrafos.map(p => `<p>${p}</p>`).join('') +
  `<p class="sign">${CARTA.assinatura}</p>`;

function heart(x, y, spread = 1){
  const el = document.createElement('div');
  const size = 14 + Math.random() * 26;
  el.className = 'heart';
  el.style.cssText = `left:${x - size/2}px;top:${y - size/2}px;width:${size}px;height:${size}px;
    --d:${2.5 + Math.random()*2.5}s;
    --dx:${(Math.random()-.5) * 220 * spread}px;
    --dy:${-(window.innerHeight * (.5 + Math.random()*.6))}px;
    --r:${(Math.random()-.5)*60}deg`;
  el.innerHTML = `<svg viewBox="0 0 32 29"><path fill="${COLORS[Math.random()*COLORS.length|0]}"
    d="M16 29S0 19 0 8.5A8.5 8.5 0 0 1 16 4a8.5 8.5 0 0 1 16 4.5C32 19 16 29 16 29z"/></svg>`;
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function burst(n){
  const r = stage.getBoundingClientRect();
  for (let i = 0; i < n; i++)
    setTimeout(() => heart(r.left + r.width*(.2 + Math.random()*.6), r.top + r.height*.4), i * 45);
}

const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 150) : ms));

async function open(){
  if (opened) return; opened = true;
  stage.classList.add('opened');           // selo some + aba abre
  if (!reduce) burst(30);
  await wait(700);
  stage.classList.add('flap-back');        // aba vai pra trás da carta
  stage.classList.add('pulled');           // carta sobe pra fora do envelope
  await wait(1200);

  // tira a carta do envelope (FLIP) e leva pro centro
  const r = letter.getBoundingClientRect();
  document.body.appendChild(letter);
  Object.assign(letter.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px', bottom:'auto', right:'auto', transform:'none'});
  letter.classList.add('free');
  stage.classList.add('gone');
  letter.offsetWidth;                      // força reflow
  letter.classList.add('big');
  document.body.classList.add('reading');

  // parágrafos aparecem um por um
  await wait(900);
  for (const p of content.querySelectorAll('p')) { p.classList.add('show'); await wait(500); }

  if (!reduce) ambient = setInterval(() =>
    heart(Math.random()*innerWidth, innerHeight + 20, .4), 700);
}

stage.addEventListener('click', open);
stage.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
</script>
</body>
</html>
